<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS-Delivery - مالح وحلو - V15 LIVE + 2 FIXES</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#FFFFFF;color:#222;padding-bottom:30px}
.header{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.logo-circle{width:56px;height:56px;background:#2563EB;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.logo-circle .rs{font-size:20px;font-weight:900;line-height:1}
.logo-circle .del{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.logo-text h1{font-size:16px;font-weight:900}
.logo-text p{font-size:11px;color:#666;font-weight:700}
.search{max-width:900px;margin:12px auto;padding:0 14px}
.search input{width:100%;padding:14px 16px;border-radius:24px;border:2px solid #E5E7EB;font-size:14px;font-weight:700;outline:none}
.grid{max-width:900px;margin:0 auto;padding:10px 14px;display:grid;gap:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1.5px solid #E5E7EB;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.card-img{position:relative;height:160px;background:#F3F4F6}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge-green{position:absolute;top:8px;left:8px;background:#00C853;color:#fff;font-size:10px;padding:4px 8px;border-radius:10px;font-weight:900}
.badge-area{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);color:#111;font-size:10px;padding:4px 10px;border-radius:12px;font-weight:800}
.card-body{padding:12px}
.card-title{display:flex;justify-content:space-between;align-items:center}
.card-title h3{font-size:15px;font-weight:900}
.meta{display:flex;gap:8px;margin-top:6px;font-size:11px;align-items:center;flex-wrap:wrap}
.meta .stars{background:#FFF8E1;color:#F59E0B;padding:3px 8px;border-radius:10px;font-weight:800}
.meta .free{background:#E8F5E9;color:#2E7D32;padding:3px 8px;border-radius:10px;font-weight:800}
.mini{display:flex;gap:6px;margin-top:8px}
.mini img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.btn-blue{margin-top:10px;width:100%;background:#2563EB;color:#fff;border:none;padding:12px;border-radius:24px;font-weight:900;font-size:14px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none}
.overlay.open{display:block}
.modal{position:fixed;bottom:0;left:0;right:0;max-width:700px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;z-index:201;transform:translateY(110%);transition:.35s;max-height:92vh;overflow:auto}
.modal.open{transform:translateY(0)}
.modal-top{position:relative;height:200px}
.modal-top img{width:100%;height:100%;object-fit:cover}
.modal-top .grad{position:absolute;inset:0;background:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.75) 100%)}
.modal-top .close{position:absolute;top:12px;left:12px;width:32px;height:32px;background:rgba(255,255,255,.9);border-radius:50%;display:grid;place-items:center;font-weight:900;cursor:pointer}
.modal-top .info{position:absolute;bottom:12px;right:12px;left:12px;color:#fff}
.modal-top .info h2{font-size:20px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.form{padding:14px}
.field{margin-bottom:12px}
.field label{font-size:13px;font-weight:900;display:block;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:14px;border:2px solid #E5E7EB;border-radius:12px;font-size:14px;font-weight:700;outline:none}
.phone-wrap{position:relative}
.phone-wrap .prefix{position:absolute;left:0;top:0;bottom:0;width:70px;background:#2563EB;color:#fff;display:grid;place-items:center;border-radius:12px 0 0 12px;font-weight:900;font-size:13px}
.phone-wrap input{padding-left:80px;background:#F0F9FF}
.gps-btn{background:#FFF3E0;border:1.5px solid #FF9100;color:#E65100;padding:8px 16px;border-radius:20px;font-weight:900;font-size:13px;cursor:pointer;margin-bottom:8px}
.wa-btn{width:100%;background:#00C853;color:#fff;border:none;padding:16px;border-radius:28px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
.wa-btn:disabled{background:#9CA3AF}
</style>
</head>
<body>
<div class="header">
<div class="logo-circle"><span class="rs">RS</span><span class="del">Delivery</span></div>
<div class="logo-text"><h1>RS-Delivery - مالح وحلو</h1><p>منصة ديلفري سوسة - مطاعم وحلويات في بلاصة وحدة 🛵</p></div>
</div>
<div class="search"><input placeholder="لوج على مطعم، بيتزا، فريت، حلويات..."></div>
<div style="max-width:900px;margin:0 auto;padding:0 14px;display:flex;gap:8px;overflow:auto"><div style="white-space:nowrap;padding:8px 16px;border-radius:20px;background:#111;color:#fff;font-weight:800">الكل</div><div style="white-space:nowrap;padding:8px 16px;border-radius:20px;background:#F3F4F6;border:2px solid #E5E7EB;font-weight:800">سهلول</div><div style="white-space:nowrap;padding:8px 16px;border-radius:20px;background:#F3F4F6;border:2px solid #E5E7EB;font-weight:800">خزامة</div><div style="white-space:nowrap;padding:8px 16px;border-radius:20px;background:#F3F4F6;border:2px solid #E5E7EB;font-weight:800">حي الرياض</div></div>
<div style="max-width:900px;margin:10px auto;padding:0 14px;display:flex;justify-content:space-between;font-size:12px;color:#666;font-weight:700"><span>7 مطعم وحلواني موجود</span><span style="background:#F3F4F6;padding:4px 10px;border-radius:12px">V15 LIVE + 2 FIXES</span></div>
<div class="grid" id="grid"></div>
<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
<div class="modal-top"><img id="mImg"><div class="grad"></div><div class="close" onclick="closeModal()">✕</div><div class="info"><h2 id="mTitle"></h2></div></div>
<div id="mList" style="padding:14px"></div>
<div style="padding:14px;background:#F9FAFB;border-top:2px solid #E5E7EB"><div style="display:flex;justify-content:space-between"><span>المجموع</span><span id="tTotal">0.0 د</span></div></div>
<div class="form">
<div class="field"><label>1- اسمك *</label><input id="cname" placeholder="اكتب اسمك هنا"></div>
<div class="field"><label>2- رقمك * 📞</label><div class="phone-wrap"><div class="prefix">+216</div><input id="cphone" type="tel" placeholder="56 711 448"></div></div>
<div class="field"><label>3- ملاحظات (اختياري)</label><textarea id="cnotes" rows="3" placeholder="مثلا: حار، بزايد بصل..."></textarea></div>
<div class="field"><label>4- موقعك GPS 📍</label><button class="gps-btn" onclick="getGPS()">📍 GPS - حدد موقعي</button><input id="caddr" placeholder="اضغط GPS أو اكتب عنوانك..."><div id="gpsStatus" style="font-size:12px;margin-top:6px;color:#2E7D32;font-weight:800"></div></div>
<button class="wa-btn" id="waBtn" onclick="sendWA()">اطلب عبر واتساب - <span id="orderId">RS-2026-0000</span> ↗</button>
</div>
</div>
<script>
const restaurants=[
{id:'RS-01',name:'فريت ماستر خزامة',area:'خزامة',rating:'4.8',img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400',cat:'فريت',menu:[{n:'فريت سبيسيال',p:7.5},{n:'فريت عائلية',p:12},{n:'تشيكن فريت',p:9.5}]},
{id:'RS-02',name:'شاورما سهلول',area:'سهلول',rating:'4.7',img:'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=400',cat:'شاورما',menu:[{n:'شاورما دجاج',p:6},{n:'شاورما لحم',p:7.5},{n:'ميكس',p:8.5}]},
{id:'RS-03',name:'بيتزا خزامة',area:'خزامة',rating:'4.9',img:'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400',cat:'بيتزا',menu:[{n:'مارغريتا',p:9},{n:'4 أجبان',p:14},{n:'ببروني',p:13}]},
{id:'RS-04',name:'بيتزا الرياض',area:'الرياض',rating:'4.6',img:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400',cat:'بيتزا',menu:[{n:'تون',p:11},{n:'دجاج',p:12},{n:'لحم',p:13}]},
{id:'RS-05',name:'برجر هاوس',area:'خزامة',rating:'4.8',img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400',cat:'برجر',menu:[{n:'كلاسيك',p:8},{n:'دبل',p:12},{n:'دجاج',p:9}]},
{id:'RS-06',name:'نادي السندويتش',area:'حمام سوسة',rating:'4.5',img:'https://images.unsplash.com/photo-1521390188846-e2a3a97453a0?w=400',cat:'سندويتش',menu:[{n:'تون',p:5},{n:'شاورما',p:6.5},{n:'كفتة',p:7}]},
{id:'RS-07',name:'ركن الحلويات',area:'القنطاوي',rating:'4.8',img:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400',cat:'حلويات',menu:[{n:'كعك ورقة',p:12},{n:'بقلاوة',p:18},{n:'بوكس مشكل',p:25}]},
];
let cur=null,cart=[],gpsLink='',orderNum='RS-2026-'+Math.floor(1000+Math.random()*9000);
function renderGrid(){let h='';restaurants.forEach(r=>{h+=`<div class="card"><div class="card-img"><img src="${r.img}"><span class="badge-green">TEST • 21656711448</span><span class="badge-area">${r.area}</span></div><div style="padding:12px"><div style="display:flex;justify-content:space-between"><h3 style="font-size:15px;font-weight:900">${r.name}</h3><span style="font-size:11px;color:#888">${r.id}</span></div><div style="display:flex;gap:8px;margin-top:6px;font-size:11px"><span style="background:#FFF8E1;color:#F59E0B;padding:3px 8px;border-radius:10px">★ ${r.rating}</span><span style="background:#E8F5E9;color:#2E7D32;padding:3px 8px;border-radius:10px">مجاني</span></div><button style="margin-top:10px;width:100%;background:#2563EB;color:#fff;border:none;padding:12px;border-radius:24px;font-weight:900" onclick="openModal('${r.id}')">اطلب الآن →</button></div></div>`});document.getElementById('grid').innerHTML=h;}
function openModal(id){cur=restaurants.find(r=>r.id===id);cart=cur.menu.map(m=>({...m,q:0}));document.getElementById('mImg').src=cur.img;document.getElementById('mTitle').textContent=cur.name;document.getElementById('orderId').textContent=orderNum;renderMenu();document.getElementById('overlay').classList.add('open');document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');document.getElementById('modal').classList.remove('open');}
function renderMenu(){let h='';cart.forEach((it,i)=>{h+=`<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed #E5E7EB"><div><h4 style="font-size:14px;font-weight:900">${it.n}</h4></div><div style="display:flex;gap:10px;align-items:center"><span style="font-weight:900;color:#2563EB">${it.p} د</span><button onclick="chg(${i},-1)" style="width:32px;height:32px;border-radius:50%;border:2px solid #E5E7EB">−</button><span>${it.q}</span><button onclick="chg(${i},1)" style="width:32px;height:32px;border-radius:50%;background:#111;color:#fff">+</button></div></div>`});document.getElementById('mList').innerHTML=h;updTotal();}
function chg(i,d){cart[i].q=Math.max(0,cart[i].q+d);renderMenu();}
function updTotal(){let s=cart.reduce((a,b)=>a+b.p*b.q,0);document.getElementById('tTotal').textContent=s.toFixed(1)+' د';let ok=s>0 && document.getElementById('cname').value.trim() && document.getElementById('cphone').value.trim();document.getElementById('waBtn').disabled=!ok;}
document.getElementById('cname').addEventListener('input',updTotal);document.getElementById('cphone').addEventListener('input',updTotal);
function getGPS(){let el=document.getElementById('gpsStatus');if(!navigator.geolocation){el.textContent='❌ ما يدعمش GPS';return;}el.textContent='⏳ نلوج...';navigator.geolocation.getCurrentPosition(p=>{gpsLink=`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;document.getElementById('caddr').value=`موقعي: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;el.innerHTML=`✅ تم! <a href="${gpsLink}" target="_blank">شوف الخريطة</a>`;});}
function sendWA(){let name=document.getElementById('cname').value.trim();let phone=document.getElementById('cphone').value.trim();let notes=document.getElementById('cnotes').value.trim();let addr=document.getElementById('caddr').value.trim();if(!cart.some(c=>c.q>0)){alert('اختار من المنيو!');return}if(!name){alert('اكتب اسمك');return}if(!phone){alert('اكتب رقمك');return}let total=cart.reduce((a,b)=>a+b.p*b.q,0);let msg=`🛵 مرحبا ${cur.name} طلب جديد ${orderNum}\n---\n👤 الاسم: ${name}\n📞 رقم الحريف: ${phone}\n`;if(addr)msg+=`📍 العنوان: ${addr}\n`;if(gpsLink)msg+=`📍 GPS: ${gpsLink}\n`;if(notes)msg+=`📝 ملاحظات: ${notes}\n`;msg+=`---\n🍽️ الطلب:\n`;cart.forEach(c=>{if(c.q>0)msg+=`• ${c.n} x${c.q} = ${(c.p*c.q).toFixed(1)} د\n`;});msg+=`💰 المجموع: ${total.toFixed(1)} د\n📦 التوصيل: مجاني\n---\nمنصة RS-Delivery - سوسة`;let wa=`https://wa.me/21656711448?text=${encodeURIComponent(msg)}`;window.open(wa,'_blank');}
renderGrid();
</script>
</body>
</html>
